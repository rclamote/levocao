name: Aplicar confirmações integradas

on:
  push:
    branches:
      - agent/confirmacoes-integradas-limpo
    paths:
      - .github/workflows/apply-confirmations.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Obter branch
        uses: actions/checkout@v4
        with:
          ref: agent/confirmacoes-integradas-limpo
          fetch-depth: 0

      - name: Aplicar alterações ao index real
        run: python .github/scripts/apply_confirmations.py

      - name: Validar JavaScript principal
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          app = next(script for script in scripts if 'const SUPABASE_URL' in script)
          Path('/tmp/levocao-app.js').write_text(app, encoding='utf-8')
          PY
          node --check /tmp/levocao-app.js

      - name: Guardar alteração no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrar confirmações no site atual"
          git push origin HEAD:agent/confirmacoes-integradas-limpo
